services:
  identityservice:
    build:
      context: ../backend
      dockerfile: IdentityService/src/IdentityService.API/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=identitydb;Username=postgres;Password=postgres
      Kafka__Host: kafka:9092
      ConsulConfig__Host: http://consul:8500
      ConsulConfig__ServiceAddress: identityservice
      ConsulConfig__ServicePort: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  courseservice:
    build:
      context: ../backend
      dockerfile: CourseService/src/CourseService.API/Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=coursesdb;Username=postgres;Password=postgres;Include Error Detail=true
      Redis__Configuration: redis:6379
      Kafka__Host: kafka:9092
      Minio__ServiceUrl: http://minio:9000
      Minio__AccessKey: minio
      Minio__SecretKey: minio123
      Minio__Bucket: courses
      Jwt__Key: super_secret_development_key_change_me
      Jwt__Issuer: IdentityService
      Jwt__Audience: CorporateTrainingFrontend
      ConsulConfig__Host: http://consul:8500
      ConsulConfig__ServiceName: CourseService
      ConsulConfig__ServiceId: courseservice-1
      ConsulConfig__ServiceAddress: courseservice
      ConsulConfig__ServicePort: 5001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  learningservice:
    build:
      context: ../backend
      dockerfile: LearningService/src/LearningService.API/Dockerfile
    ports:
      - "5002:5002"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      courseservice:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=learningdb;Username=postgres;Password=postgres
      Kafka__Host: kafka:9092
      CourseService__BaseUrl: http://courseservice:5001
      Jwt__Key: super_secret_development_key_change_me
      Jwt__Issuer: IdentityService
      Jwt__Audience: CorporateTrainingFrontend
      ConsulConfig__Host: http://consul:8500
      ConsulConfig__ServiceName: LearningService
      ConsulConfig__ServiceId: learningservice-1
      ConsulConfig__ServiceAddress: learningservice
      ConsulConfig__ServicePort: 5002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  notificationservice:
    build:
      context: ../backend
      dockerfile: NotificationService/src/NotificationService.API/Dockerfile
    ports:
      - "5003:5003"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Database=notificationdb;Username=postgres;Password=postgres
      Kafka__Host: kafka:9092
      ConsulConfig__Host: http://consul:8500
      ConsulConfig__ServiceName: NotificationService
      ConsulConfig__ServiceId: notificationservice-1
      ConsulConfig__ServiceAddress: notificationservice
      ConsulConfig__ServicePort: 5003
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  gateway:
    build:
      context: ../backend
      dockerfile: Gateway/src/Gateway.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      consul:
        condition: service_healthy
      identityservice:
        condition: service_healthy
      courseservice:
        condition: service_healthy
      learningservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Consul__Address: http://consul:8500
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  postgres:
    image: postgres:16-alpine
    container_name: cts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identitydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis: 
    image: redis:7-alpine
    container_name: cts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  consul:
    image: hashicorp/consul:latest
    container_name: cts-consul
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
        
  seq:
    image: datalust/seq:latest
    container_name: cts-seq
    restart: unless-stopped
    environment:
        ACCEPT_EULA: "Y"
        SEQ_FIRSTRUN_ADMINPASSWORD: "seqPassword123"
    ports:
      - "5341:80"
        
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    container_name: cts-kafka
    restart: unless-stopped
    environment:
      # Official apache/kafka image expects KAFKA_* (not Bitnami KAFKA_CFG_*).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Required for KRaft storage format on first start (see Apache Kafka Docker examples).
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
        
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cts-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
        
  minio:
    image: minio/minio:latest
    container_name: cts-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"  
      - "9001:9001"  
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cts-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cts-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cts-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  minio_data: