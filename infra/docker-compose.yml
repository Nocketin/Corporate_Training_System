services:
  identityservice:
    build:
      context: ../backend
      dockerfile: IdentityService/src/IdentityService.API/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - consul
      - postgres
      - redis
    restart: unless-stopped


  gateway:
    build:
      context: ../backend/Gateway/src
      dockerfile: Gateway.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - consul
      - identityservice
  postgres:
    image: postgres:16-alpine
    container_name: cts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identitydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis: 
    image: redis:7-alpine
    container_name: cts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    
  consul:
    image: hashicorp/consul:latest
    container_name: cts-consul
    command: agent -dev -client=0.0.0.0
    restart: unless-stopped
    ports:
      - "8500:8500"
        
  seq:
    image: datalust/seq:latest
    container_name: cts-seq
    restart: unless-stopped
    environment:
        ACCEPT_EULA: "Y"
        SEQ_FIRSTRUN_ADMINPASSWORD: "seqPassword123"
    ports:
      - "5341:80"
        
  kafka:
    image: apache/kafka:4.1.1
    container_name: cts-kafka
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
        
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cts-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
        
  minio:
    image: minio/minio:latest
    container_name: cts-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"  
      - "9001:9001"  
    volumes:
      - minio_data:/data
    
volumes:
  postgres_data:
  minio_data: